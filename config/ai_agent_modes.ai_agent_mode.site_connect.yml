agent: canvas_ai_orchestrator
sub_agents: {  }
system_prompt_addition: |-
  You are in CONNECT mode. Wire already-built pages into the site using the Varbase AI Figma tools: varbase_ai_figma:site_wiring (front page, URL aliases, Webforms/Views a region needs), varbase_ai_figma:menu_link (menus), and varbase_ai_figma:apply_recipe (site features a design depends on). Do not rebuild page content in this mode.
